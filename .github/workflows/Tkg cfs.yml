name: Build Android Kernel with TKG CFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone kernel source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/kernel_samsung_a12
          path: kernel_root
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc cpio flex bison git python-is-python3 \
            tar perl wget curl curl lz4 libssl-dev

      - name: Setup swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone toolchains
        working-directory: kernel_root
        run: |
          mkdir -p toolchains
          cd toolchains
          git clone --depth=1 -b clang-11 https://github.com/rsuntk/toolchains.git clang
          git clone --depth=1 -b androidcc-4.9 https://github.com/rsuntk/toolchains.git google

      - name: Download linux-tkg patches
        working-directory: kernel_root
        run: |
          git clone --depth=1 --branch legacy https://github.com/Frogging-Family/linux-tkg.git tkg

      - name: Apply TKG CFS patch
        working-directory: kernel_root
        run: |
          PATCH_DIR="tkg/linux419-tkg/linux419-tkg-patches"
          patch -p1 < "$PATCH_DIR/0003-glitched-cfs.patch"

      - name: Configure kernel
        working-directory: kernel_root
        run: |
          scripts/config --disable SCHED_EMS || true
          scripts/config --disable SCHED_EMS_TUNE || true
          scripts/config --disable CPU_FREQ_GOV_ENERGYSTEP || true
          scripts/config --disable WERROR || true

          scripts/config --enable SCHED_TUNE || true
          scripts/config --enable ENERGY_MODEL || true
          scripts/config --enable SCHED_MC || true

          make olddefconfig

      - name: Build kernel
        working-directory: kernel_root
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=$(pwd)/toolchains/google/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"

          export DEFCONFIG=exlinux_defconfig
          bash $(pwd)/build_kernel.sh kernel --jobs $(nproc --all) $DEFCONFIG

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: |
            kernel_root/out/arch/arm64/boot/Image*
          if-no-files-found: warn
