name: Build Bash ARM64 Fully Static

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASH_VER: 5.2.37
      TOOLCHAIN_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2025.08-1.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget file xz-utils \
            build-essential \
            bison flex texinfo \
            autoconf automake libtool

      - name: Download Bootlin musl toolchain
        run: |
          wget -q "$TOOLCHAIN_URL" -O toolchain.tar.xz
          tar -xf toolchain.tar.xz

      - name: Download Bash source
        run: |
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -O bash.tar.gz
          tar -xf bash.tar.gz
          mv "bash-${BASH_VER}" bash

      - name: Configure Bash
        run: |
          set -euxo pipefail

          TOOLCHAIN_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'aarch64*musl*' | head -n1)"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export AS=aarch64-linux-musl-as
          export LD=aarch64-linux-musl-ld
          export RANLIB=aarch64-linux-musl-ranlib
          export STRIP=aarch64-linux-musl-strip
          export HOSTCC=gcc

          cd bash
          ./configure \
            --host=aarch64-linux-musl \
            --disable-nls \
            --without-bash-malloc \
            --enable-static-link

      - name: Build Bash
        run: |
          set -euxo pipefail

          TOOLCHAIN_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'aarch64*musl*' | head -n1)"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export AS=aarch64-linux-musl-as
          export LD=aarch64-linux-musl-ld
          export RANLIB=aarch64-linux-musl-ranlib
          export STRIP=aarch64-linux-musl-strip

          cd bash
          make -j"$(nproc)" LDFLAGS="-static"

      - name: Verify static binary
        run: |
          set -euxo pipefail
          file bash/bash
          if readelf -d bash/bash 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Bash is not fully static"
            exit 1
          fi

      - name: Strip binary
        run: |
          set -euxo pipefail
          TOOLCHAIN_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'aarch64*musl*' | head -n1)"
          "$TOOLCHAIN_DIR/bin/aarch64-linux-musl-strip" bash/bash || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
          if-no-files-found: error
