name: Build Static Bash ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git build-essential clang llvm

      - name: Clone Bash source
        run: |
          git clone --depth=1 https://git.savannah.gnu.org/git/bash.git
          cd bash

      - name: Install Android toolchain
        run: |
          git clone --depth=1 -b clang-11 https://github.com/rsuntk/toolchains.git clang

      - name: Configure static build
        run: |
          cd bash

          export TOOLCHAIN=$GITHUB_WORKSPACE/clang
          export PATH=$TOOLCHAIN/bin:$PATH

          export CC=aarch64-linux-android-clang
          export CXX=aarch64-linux-android-clang++
          export AR=aarch64-linux-android-ar
          export STRIP=aarch64-linux-android-strip

          ./configure \
            --host=aarch64-linux-android \
            --enable-static-link \
            --without-bash-malloc \
            --disable-nls

      - name: Build Bash
        run: |
          cd bash
          make -j$(nproc)

      - name: Strip binary
        run: |
          $GITHUB_WORKSPACE/clang/bin/aarch64-linux-android-strip bash/bash

      - name: Check static
        run: |
          file bash/bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
