name: Build Bash ARM64 Fully Static

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASH_VER: 5.2.37
      TOOLCHAIN_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2025.08-1.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget file xz-utils \
            build-essential \
            bison flex texinfo \
            autoconf automake libtool

      - name: Download Bootlin musl toolchain
        run: |
          wget -q "$TOOLCHAIN_URL" -O toolchain.tar.xz
          tar -xf toolchain.tar.xz

      - name: Download Bash source
        run: |
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -O bash.tar.gz
          tar -xf bash.tar.gz
          mv "bash-${BASH_VER}" bash

      - name: Build Bash
        run: |
          set -euxo pipefail

          TOOLCHAIN_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'aarch64*musl*' | head -n1)"
          GCC_BIN="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*gcc' | sort | head -n1)"
          PREFIX="${GCC_BIN%gcc}"
          HOST_TRIPLE="${PREFIX%-}"

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CC="${PREFIX}gcc"
          export CXX="${PREFIX}g++"
          export AR="${PREFIX}ar"
          export AS="${PREFIX}as"
          export LD="${PREFIX}ld"
          export RANLIB="${PREFIX}ranlib"
          export STRIP="${PREFIX}strip"
          export HOSTCC=gcc
          export CFLAGS="-Os -static"
          export CPPFLAGS="$CFLAGS"
          export LDFLAGS="-static"

          cd bash
          ./configure \
            --host="$HOST_TRIPLE" \
            --disable-nls \
            --without-bash-malloc \
            --enable-static-link \
            --enable-largefile \
            --enable-alias \
            --enable-history

          make -j"$(nproc)"

          file bash
          if readelf -d bash 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Bash is not fully static"
            exit 1
          fi

          strip -s bash || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
          if-no-files-found: error
