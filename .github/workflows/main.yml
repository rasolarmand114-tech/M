name: Build Bash ARM64 Static (musl)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASH_VER: 5.2.37
      TOOLCHAIN_DIR: ${{ github.workspace }}/aarch64-linux-musl-cross
      CROSS_PREFIX: aarch64-linux-musl-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget file \
            build-essential \
            bison flex texinfo \
            autoconf automake libtool

      - name: Download musl toolchain
        run: |
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz -O toolchain.tgz
          tar -xf toolchain.tgz
          echo "${TOOLCHAIN_DIR}/bin" >> "$GITHUB_PATH"

      - name: Download Bash source
        run: |
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -O bash.tar.gz
          tar -xf bash.tar.gz
          mv "bash-${BASH_VER}" bash

      - name: Configure Bash
        working-directory: bash
        run: |
          set -euxo pipefail

          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"
          export CC="${CROSS_PREFIX}gcc"
          export CXX="${CROSS_PREFIX}g++"
          export AR="${CROSS_PREFIX}ar"
          export AS="${CROSS_PREFIX}as"
          export LD="${CROSS_PREFIX}ld"
          export RANLIB="${CROSS_PREFIX}ranlib"
          export STRIP="${CROSS_PREFIX}strip"
          export HOSTCC=gcc

          export CFLAGS="-O2"
          export CPPFLAGS=""
          export LDFLAGS=""

          ./configure \
            --host=aarch64-linux-musl \
            --disable-nls \
            --without-bash-malloc \
            --enable-static-link

      - name: Build Bash
        working-directory: bash
        run: |
          set -euxo pipefail

          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"
          export CC="${CROSS_PREFIX}gcc"
          export CXX="${CROSS_PREFIX}g++"
          export AR="${CROSS_PREFIX}ar"
          export AS="${CROSS_PREFIX}as"
          export LD="${CROSS_PREFIX}ld"
          export RANLIB="${CROSS_PREFIX}ranlib"
          export STRIP="${CROSS_PREFIX}strip"

          make -j"$(nproc)" \
            CFLAGS="-O2" \
            CPPFLAGS="" \
            LDFLAGS="-static"

      - name: Verify binary
        run: |
          set -euxo pipefail
          file bash/bash
          if readelf -d bash/bash 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Bash is not fully static"
            exit 1
          fi
          "${TOOLCHAIN_DIR}/bin/${CROSS_PREFIX}strip" bash/bash || true
          file bash/bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
          if-no-files-found: error
