name: Build Bash ARM64 Static

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASH_VER: 5.2.37
      TOOLCHAIN_DIR: ${{ github.workspace }}/google
      CROSS_PREFIX: aarch64-linux-android-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget file \
            build-essential \
            bison flex texinfo \
            autoconf automake libtool

      - name: Clone Android GCC 4.9 toolchain
        run: |
          git clone --depth=1 -b androidcc-4.9 https://github.com/rsuntk/toolchains.git google
          chmod +x google/bin/* || true

      - name: Download Bash source
        run: |
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -O bash.tar.gz
          tar -xf bash.tar.gz
          mv "bash-${BASH_VER}" bash

      - name: Configure Bash
        working-directory: bash
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"

          export CC="${CROSS_PREFIX}gcc"
          export CXX="${CROSS_PREFIX}g++"
          export AR="${CROSS_PREFIX}ar"
          export AS="${CROSS_PREFIX}as"
          export LD="${CROSS_PREFIX}ld"
          export RANLIB="${CROSS_PREFIX}ranlib"
          export STRIP="${CROSS_PREFIX}strip"
          export HOSTCC=gcc

          export CFLAGS="-O2"
          export CPPFLAGS=""
          export LDFLAGS=""

          ./configure \
            --host=aarch64-linux-android \
            --build=x86_64-pc-linux-gnu \
            --disable-nls \
            --without-bash-malloc

      - name: Build Bash
        working-directory: bash
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"

          export CC="${CROSS_PREFIX}gcc"
          export CXX="${CROSS_PREFIX}g++"
          export AR="${CROSS_PREFIX}ar"
          export AS="${CROSS_PREFIX}as"
          export LD="${CROSS_PREFIX}ld"
          export RANLIB="${CROSS_PREFIX}ranlib"
          export STRIP="${CROSS_PREFIX}strip"

          make -j"$(nproc)" \
            CFLAGS="-O2" \
            CPPFLAGS="" \
            LDFLAGS="-static"

      - name: Verify binary
        run: |
          set -euxo pipefail
          file bash/bash
          "${TOOLCHAIN_DIR}/bin/${CROSS_PREFIX}strip" bash/bash || true
          file bash/bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
          if-no-files-found: error
