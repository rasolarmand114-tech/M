name: Build Bash ARM64 Static (GCC 4.9)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASH_VER: 5.2.37
      TOOLCHAIN_DIR: ${{ github.workspace }}/google

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget file \
            build-essential \
            bison flex texinfo \
            autoconf automake libtool

      - name: Clone Android GCC 4.9 toolchain
        run: |
          git clone --depth=1 -b androidcc-4.9 https://github.com/rsuntk/toolchains.git google
          chmod +x google/bin/* || true

      - name: Download Bash source
        run: |
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -O bash.tar.gz
          tar -xf bash.tar.gz
          mv "bash-${BASH_VER}" bash

      - name: Sanity check compiler
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc -v

          cat > test.c <<'EOF'
          int main(void) { return 0; }
          EOF

          # Simple dynamic test
          aarch64-linux-android-gcc test.c -o test_dyn

          # Static test is allowed to fail here; we only want the real error if it exists
          aarch64-linux-android-gcc -static test.c -o test_static || true

      - name: Configure Bash
        working-directory: bash
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"

          export CC=aarch64-linux-android-gcc
          export CXX=aarch64-linux-android-g++
          export AR=aarch64-linux-android-ar
          export AS=aarch64-linux-android-as
          export LD=aarch64-linux-android-ld
          export RANLIB=aarch64-linux-android-ranlib
          export STRIP=aarch64-linux-android-strip
          export HOSTCC=gcc

          # Do NOT force -static here; let configure pass first.
          export CFLAGS="-O2"
          export CPPFLAGS=""
          export LDFLAGS=""

          ./configure \
            --host=aarch64-linux-android \
            --build=x86_64-pc-linux-gnu \
            --disable-nls \
            --without-bash-malloc

      - name: Build Bash static
        working-directory: bash
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_DIR}/bin:${PATH}"

          export CC=aarch64-linux-android-gcc
          export CXX=aarch64-linux-android-g++
          export AR=aarch64-linux-android-ar
          export AS=aarch64-linux-android-as
          export LD=aarch64-linux-android-ld
          export RANLIB=aarch64-linux-android-ranlib
          export STRIP=aarch64-linux-android-strip

          make -j"$(nproc)" \
            CFLAGS="-O2" \
            CPPFLAGS="" \
            LDFLAGS="-static"

      - name: Verify binary
        run: |
          set -euxo pipefail
          file bash/bash

          # Fail if the binary still has dynamic dependencies
          if readelf -d bash/bash 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Bash is not fully static"
            exit 1
          fi

          "${TOOLCHAIN_DIR}/bin/aarch64-linux-android-strip" bash/bash || true
          file bash/bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
          if-no-files-found: error
