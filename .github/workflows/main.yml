name: Build Bash ARM64 Fully Static

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASH_VER: 5.2.37
      TOOLCHAIN_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2025.08-1.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget file xz-utils \
            build-essential \
            bison flex texinfo \
            autoconf automake libtool

      - name: Download and extract musl toolchain
        run: |
          wget -q "$TOOLCHAIN_URL" -O toolchain.tar.xz
          tar -xf toolchain.tar.xz
          ls -la
          # Find the actual toolchain directory
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name 'aarch64*' | head -n1)
          echo "Toolchain directory: $TOOLCHAIN_DIR"
          ls -la "$TOOLCHAIN_DIR/bin/" | head -20

      - name: Download Bash source
        run: |
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -O bash.tar.gz
          tar -xf bash.tar.gz
          mv "bash-${BASH_VER}" bash

      - name: Build Bash with ARM64 cross-compiler
        run: |
          set -euxo pipefail

          # Find the toolchain directory
          TOOLCHAIN_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'aarch64*' | head -n1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "::error::Toolchain directory not found!"
            exit 1
          fi

          TOOLCHAIN_BIN="$TOOLCHAIN_DIR/bin"
          echo "Using toolchain: $TOOLCHAIN_DIR"
          echo "Contents of bin directory:"
          ls -la "$TOOLCHAIN_BIN/" | grep -E 'gcc|cc'

          # Extract the cross-compiler prefix (e.g., aarch64-linux-musl)
          # Look for the actual cross-compiler binary
          CC_BIN=$(find "$TOOLCHAIN_BIN" -maxdepth 1 -type f -name '*gcc' | head -n1)
          if [ -z "$CC_BIN" ]; then
            echo "::error::Cross-compiler gcc not found in toolchain!"
            exit 1
          fi

          # Get the prefix by removing '-gcc' from the binary name
          PREFIX="${CC_BIN%-gcc}"
          PREFIX="${PREFIX##*/}"  # Get just the filename
          
          echo "Cross-compiler prefix: $PREFIX"
          echo "Full gcc path: $CC_BIN"

          # Set up cross-compilation environment
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CC="${PREFIX}-gcc"
          export CXX="${PREFIX}-g++"
          export AR="${PREFIX}-ar"
          export AS="${PREFIX}-as"
          export LD="${PREFIX}-ld"
          export RANLIB="${PREFIX}-ranlib"
          export STRIP="${PREFIX}-strip"
          export HOSTCC=gcc

          # Verify the compiler works
          echo "Testing compiler:"
          $CC --version
          $CC -dumpmachine

          # Get the host triple directly (this is the target for cross-compilation)
          HOST_TRIPLE=$($CC -dumpmachine)
          echo "Target architecture (HOST_TRIPLE): $HOST_TRIPLE"

          # Additional flags for musl static linking
          export CFLAGS="-static -O2"
          export LDFLAGS="-static"

          cd bash

          # Configure for cross-compilation
          ./configure \
            --host="$HOST_TRIPLE" \
            --disable-nls \
            --without-bash-malloc \
            --enable-static-link \
            --enable-largefile \
            --enable-alias \
            --enable-history \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB"

          # Build with proper linker flags
          make -j"$(nproc)" LDFLAGS="-static" CC="$CC"

          # Verify the binary
          echo "=== Binary verification ==="
          ls -lh bash
          file bash
          readelf -h bash | grep Machine

          # Check for dynamic dependencies
          if readelf -d bash 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Bash contains dynamic library dependencies!"
            readelf -d bash | grep NEEDED
            exit 1
          fi

          # Strip if possible
          $STRIP -s bash || true
          ls -lh bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-arm64-static
          path: bash/bash
          if-no-files-found: error
