name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux
          path: kernel_root
          ref: ${{ github.event.inputs.BRANCH }}
          fetch-depth: 0

      - name: Prepare dependencies + fetch tags
        working-directory: kernel_root
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc cpio flex bison git python-is-python3 \
            tar perl wget curl lz4 libssl-dev

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Recreate 12GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fetch toolchains (Clang 18.1.3 + GCC 4.9)
        working-directory: kernel_root
        run: |
          mkdir -p toolchains
          cd toolchains

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.3/clang+llvm-18.1.3-x86_64-linux-gnu-ubuntu-22.04.tar.xz

          tar -xf clang+llvm-18.1.3-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          mv clang+llvm-18.1.3-x86_64-linux-gnu-ubuntu-22.04 clang

          git clone --depth=1 -b androidcc-4.9 https://github.com/rsuntk/toolchains.git google

      - name: Set timezone (Asia/Kolkata)
        run: |
          sudo rm /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

      - name: Build kernel
        id: buildKernel
        working-directory: kernel_root
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=$(pwd)/toolchains/google/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/toolchains/google/bin/arm-linux-androideabi-

          export CC=clang
          export CXX=clang++

          export LLVM=1
          export LLVM_IAS=1

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export KBUILD_BUILD_USER="exlinux"
          export KBUILD_BUILD_HOST="github"

          export BUILD_START=$(date)
          export IS_CI=true

          export DEFCONFIG="exlinux_defconfig"
          export DEVICE_ID="A12s"
          export KERNEL_SOURCE="https://github.com/rasolarmand114-tech/exlinux"

          echo "Compiler:"
          clang --version

          if [[ "${{ github.event.inputs.SELINUX_PERMISSIVE }}" == 'true' ]]; then
            echo "Switching SELinux to Permissive mode..."

            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> arch/arm64/configs/$DEFCONFIG
            grep "PERMISSIVE" arch/arm64/configs/$DEFCONFIG

            SELINUX_STATE="Permissive"
          else
            SELINUX_STATE="Enforcing"
          fi

          echo "SELinux is set to: $SELINUX_STATE"

          bash $(pwd)/build_kernel.sh kernel --jobs $(nproc --all) $DEFCONFIG

          mv .config build_config.txt

          gitsha1=$(git rev-parse --short HEAD)
          buildDetails="$(make kernelversion)-${DEVICE_ID}_${gitsha1}-$(date +'%Y%m%d%H%M%S')"

          echo "buildDetails=$buildDetails" >> $GITHUB_OUTPUT

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/arch/arm64/boot/Image.gz
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
