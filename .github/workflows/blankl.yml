name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux
          path: kernel_root
          ref: ${{ github.event.inputs.BRANCH }}
          fetch-depth: 0

      - name: Prepare dependencies + fetch tags
        working-directory: kernel_root
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc cpio flex bison git python-is-python3 \
            tar perl wget curl lz4 libssl-dev \
            libclang-dev llvm-dev

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Recreate 12GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fetch toolchains (Clang 11 + GCC 4.9)
        working-directory: kernel_root
        run: |
          mkdir toolchains && cd toolchains
          git clone --depth=1 -b clang-11 https://github.com/rsuntk/toolchains.git clang
          git clone --depth=1 -b androidcc-4.9 https://github.com/rsuntk/toolchains.git google

      - name: Install Rust toolchain (aarch64-unknown-none)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain stable \
            --profile minimal

          source "$HOME/.cargo/env"

          # Add the bare-metal aarch64 target for kernel compilation
          rustup target add aarch64-unknown-none

          # rust-src is required by the kernel build system (RUST_LIB_SRC)
          rustup component add rust-src rustfmt

          # bindgen is required to generate Rust bindings from C headers
          cargo install bindgen-cli --locked

          # Persist env for all subsequent steps
          echo "$HOME/.cargo/bin"    >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo"   >> "$GITHUB_ENV"
          echo "RUST_TARGET=aarch64-unknown-none" >> "$GITHUB_ENV"

          # Verify
          rustc --version
          cargo --version
          bindgen --version

      - name: Set timezone (Asia/Kolkata)
        run: |
          sudo rm /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

      - name: Fetch and apply patch (0001-schad-arg-hook)
        working-directory: kernel_root
        run: |
          PATCH_FILE="0001-schad-arg-hook.patch"
          PATCH_REPO="https://raw.githubusercontent.com/rasolarmand114-tech/Patch"

          echo "Downloading patch..."
          # Try main branch first, fall back to master
          curl -fsSL "${PATCH_REPO}/main/${PATCH_FILE}"   -o "${PATCH_FILE}" \
          || curl -fsSL "${PATCH_REPO}/master/${PATCH_FILE}" -o "${PATCH_FILE}"

          echo "Verifying patch..."
          head -5 "${PATCH_FILE}"

          echo "Applying patch..."
          git apply --whitespace=fix "${PATCH_FILE}"

          echo "Patch applied successfully."
          rm -f "${PATCH_FILE}"

      - name: Build kernel
        id: buildKernel
        working-directory: kernel_root
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=$(pwd)/toolchains/google/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="exlinux"
          export KBUILD_BUILD_HOST="github"
          export BUILD_START=$(date)
          export IS_CI=true

          # Rust environment for the kernel build system
          export RUST_LIB_SRC="$(rustc --print sysroot)/lib/rustlib/src/rust/library"

          export DEFCONFIG="exlinux_defconfig"
          export DEVICE_ID="A12s"
          export KERNEL_SOURCE="https://github.com/rasolarmand114-tech/exlinux"

          if [[ "${{ github.event.inputs.SELINUX_PERMISSIVE }}" == 'true' ]]; then
            echo "Switching SELinux to Permissive mode..."
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> arch/arm64/configs/$DEFCONFIG
            grep "PERMISSIVE" arch/arm64/configs/$DEFCONFIG
            SELINUX_STATE="Permissive"
          else
            SELINUX_STATE="Enforcing"
          fi

          echo "SELinux is set to: $SELINUX_STATE"

          bash $(pwd)/build_kernel.sh kernel --jobs $(nproc --all) $DEFCONFIG

          mv .config build_config.txt
          gitsha1=$(git rev-parse --short HEAD)
          buildDetails="$(make kernelversion)-$(echo $DEVICE_ID)_${gitsha1}-$(date +'%Y%m%d%H%M%S')"
          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/arch/arm64/boot/Image.gz
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
