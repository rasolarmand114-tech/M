name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux
          path: kernel_root
          ref: ${{ github.event.inputs.BRANCH }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc bison flex git wget curl tar \
            cpio perl python-is-python3 \
            libssl-dev lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download LLVM/Clang 18.1.0 toolchain
        run: |
          TOOLCHAIN_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.0/clang+llvm-18.1.0-aarch64-linux-gnu.tar.xz"
          echo "Downloading toolchain..."
          curl -L "$TOOLCHAIN_URL" -O clang-llvm.tar.xz
          mkdir -p "$HOME/toolchain/clang"
          tar -xf clang-llvm.tar.xz -C "$HOME/toolchain/clang" --strip-components=1
          echo "$HOME/toolchain/clang/bin" >> "$GITHUB_PATH"
          echo "Toolchain installed:"
          "$HOME/toolchain/clang/bin/clang" --version
          "$HOME/toolchain/clang/bin/ld.lld" --version

      - name: Prepare swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set timezone
        run: |
          sudo rm -f /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

      - name: Build kernel with pure Clang/LLVM
        id: buildKernel
        working-directory: kernel_root
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export KBUILD_BUILD_USER="exlinux"
          export KBUILD_BUILD_HOST="github"
          export IS_CI=true

          mkdir -p aout

          echo "=== Compiler Info ==="
          clang --version
          ld.lld --version

          if [[ "${{ github.event.inputs.SELINUX_PERMISSIVE }}" == 'true' ]]; then
            echo "Switching SELinux to Permissive mode..."
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> arch/arm64/configs/exlinux_defconfig
          fi

          MAKE_ARGS="O=aout ARCH=arm64
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1"

          echo "=== Loading defconfig ==="
          make -j$(nproc) $MAKE_ARGS exlinux_defconfig

          echo "=== Building kernel ==="
          make -j$(nproc) $MAKE_ARGS Image.gz dtbs

          gitsha1=$(git rev-parse --short HEAD)
          buildDetails="$(make -s O=aout ARCH=arm64 kernelversion)-A12s_${gitsha1}-$(date +'%Y%m%d%H%M%S')"
          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"
          echo "Build: $buildDetails"

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/aout/arch/arm64/boot/Image.gz
            kernel_root/aout/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/aout/arch/arm64/boot/dts/samsung/*.dtb
