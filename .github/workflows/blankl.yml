name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: "main"
        required: true
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux
          path: kernel_root
          ref: ${{ github.event.inputs.BRANCH }}
          fetch-depth: 0

      - name: Prepare dependencies + fetch tags
        working-directory: kernel_root
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc cpio flex bison git python-is-python3 \
            tar perl wget curl lz4 libssl-dev \
            libclang-dev libelf-dev llvm-dev

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Recreate 12GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fetch toolchains (Clang 11 + GCC 4.9)
        working-directory: kernel_root
        run: |
          mkdir -p toolchains
          cd toolchains

          git clone --depth=1 -b clang-11 https://github.com/rsuntk/toolchains.git clang
          git clone --depth=1 -b androidcc-4.9 https://github.com/rsuntk/toolchains.git google

      - name: Remove pre-installed Rust
        run: |
          rustup self uninstall -y 2>/dev/null || true

          sudo rm -rf \
            "$HOME/.cargo" \
            "$HOME/.rustup" \
            /usr/share/rust \
            /usr/local/cargo \
            /usr/local/rustup

          sudo rm -f \
            /usr/local/bin/rustup \
            /usr/local/bin/rustc \
            /usr/local/bin/cargo \
            /usr/bin/rustup \
            /usr/bin/rustc \
            /usr/bin/cargo

          which rustc || echo "rustc clean"
          which cargo || echo "cargo clean"
          which rustup || echo "rustup clean"

      - name: Install Rust toolchain
        run: |
          CLANG_BIN="$GITHUB_WORKSPACE/kernel_root/toolchains/clang/bin"

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --profile minimal \
            --default-toolchain none

          source "$HOME/.cargo/env"

          rustup toolchain install nightly-2024-02-01
          rustup component add rust-src --toolchain nightly-2024-02-01
          rustup component add rustfmt --toolchain nightly-2024-02-01
          rustup target add aarch64-unknown-none --toolchain nightly-2024-02-01
          cargo +nightly-2024-02-01 install bindgen-cli --locked

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" << EOF
          [target.aarch64-unknown-none]
          linker = "${CLANG_BIN}/clang"
          ar = "${CLANG_BIN}/llvm-ar"
          EOF

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          echo "RUSTUP_HOME=$HOME/.rustup"            >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo"              >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=nightly-2024-02-01"  >> "$GITHUB_ENV"
          echo "RUST_TARGET=aarch64-unknown-none"      >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$CLANG_BIN"             >> "$GITHUB_ENV"

          rustc +nightly-2024-02-01 --version
          cargo +nightly-2024-02-01 --version
          bindgen --version

      - name: Set timezone
        run: |
          sudo rm -f /etc/localtime
          sudo ln -sf /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

      - name: Build kernel
        id: buildKernel
        working-directory: kernel_root
        run: |
          # CONFIG_SCHAD_ARG=y (hook در kernel/sched/) — in-tree، نیاز به defconfig داره
          echo "CONFIG_SCHAD_ARG=y" >> arch/arm64/configs/exlinux_defconfig
          # CONFIG_SCHAD_ARG_KMM از defconfig حذف شد — external module، مستقیم به make پاس میشه

          export PATH=$(pwd)/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=$(pwd)/toolchains/google/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export RUSTUP_TOOLCHAIN=nightly-2024-02-01
          export RUSTC="$HOME/.cargo/bin/rustc"
          export CARGO="$HOME/.cargo/bin/cargo"
          export RUST_LIB_SRC="$(rustc +nightly-2024-02-01 --print sysroot)/lib/rustlib/src/rust/library"
          export KBUILD_BUILD_USER=exlinux
          export KBUILD_BUILD_HOST=github
          export BUILD_START=$(date)
          export IS_CI=true

          export DEFCONFIG=exlinux_defconfig
          export DEVICE_ID=A12s
          export KERNEL_SOURCE=https://github.com/rasolarmand114-tech/exlinux

          if [[ "${{ github.event.inputs.SELINUX_PERMISSIVE }}" == "true" ]]; then
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> arch/arm64/configs/$DEFCONFIG
            SELINUX_STATE="Permissive"
          else
            SELINUX_STATE="Enforcing"
          fi

          echo "SELinux is set to: $SELINUX_STATE"

          bash build_kernel.sh kernel --jobs $(nproc --all) $DEFCONFIG

          mv .config build_config.txt || true

          gitsha1=$(git rev-parse --short HEAD)
          buildDetails="$(make kernelversion)-${DEVICE_ID}_${gitsha1}-$(date +'%Y%m%d%H%M%S')"

          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"

      # ── مرحله ۱: کامپایل Rust → arg_rust.o ─────────────────────────
      # Linux 4.19 نیتیو Rust support نداره.
      # rustc مستقیم صدا زده میشه و arg_rust.o رو قبل از kbuild میسازه.
      # کامپایلر: rustc nightly-2024-02-01, target: aarch64-unknown-none
      - name: Build ARG Rust core (arg_rust.o)
        working-directory: kernel_root
        run: |
          source "$HOME/.cargo/env"

          ARG_DIR="$GITHUB_WORKSPACE/kernel_root/arg"
          RUST_SYSROOT=$(rustc +nightly-2024-02-01 --print sysroot)

          echo "=== Rust compiler ==="
          rustc +nightly-2024-02-01 --version
          echo "=== sysroot: $RUST_SYSROOT ==="
          echo "=== target: aarch64-unknown-none ==="

          rustc +nightly-2024-02-01                    \
            --edition 2021                             \
            --crate-type staticlib                     \
            --crate-name arg_sched                     \
            --target aarch64-unknown-none              \
            -C panic=abort                             \
            -C opt-level=2                             \
            -C code-model=small                        \
            -C relocation-model=pic                    \
            --emit obj                                 \
            -Z unstable-options                        \
            -Z build-std=core,alloc                    \
            --sysroot "$RUST_SYSROOT"                  \
            -A dead_code                               \
            -A unused_variables                        \
            -A non_snake_case                          \
            -A non_upper_case_globals                  \
            -o "$ARG_DIR/arg_rust.o"                   \
            "$ARG_DIR/src/lib.rs"

          echo "=== arg_rust.o built ==="
          ls -lh "$ARG_DIR/arg_rust.o"
          file "$ARG_DIR/arg_rust.o"

      # ── مرحله ۲: build ماژول با kbuild (external module) ────────────
      # M= یعنی kbuild وارد arg/ میشه بدون اینکه نیاز به root Makefile/Kconfig باشه.
      # arg_rust.o از مرحله قبل آماده‌ست؛ rule خالی در arg/Makefile → kbuild دستش نمیزنه.
      - name: Build ARG kernel module (arg_sched.ko)
        working-directory: kernel_root
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$PATH

          make -C "$GITHUB_WORKSPACE/kernel_root"                                \
               M="$GITHUB_WORKSPACE/kernel_root/arg"                             \
               ARCH=arm64                                                         \
               CC=$(pwd)/toolchains/clang/bin/clang                              \
               CROSS_COMPILE=$(pwd)/toolchains/google/bin/aarch64-linux-android- \
               CLANG_TRIPLE=aarch64-linux-gnu-                                   \
               CONFIG_SCHAD_ARG=y                                                 \
               CONFIG_SCHAD_ARG_KMM=m                                             \
               -j$(nproc --all)                                                   \
               modules

          echo "=== .ko files ==="
          find "$GITHUB_WORKSPACE/kernel_root/arg" -name "*.ko" | while read ko; do
            ls -lh "$ko"
            file "$ko"
          done

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          if-no-files-found: warn
          path: |
            kernel_root/arch/arm64/boot/Image
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
            kernel_root/arg/arg_sched.ko
