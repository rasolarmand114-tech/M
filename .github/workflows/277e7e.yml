name: Build Kernel - AOSP Clang r450784d

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        required: true
        default: main
        type: string

      SELINUX_PERMISSIVE:
        description: Build kernel with permissive SELinux
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build A12s Kernel
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux-
          ref: ${{ inputs.BRANCH }}
          path: kernel_root
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Build Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            cpio \
            flex \
            git \
            libssl-dev \
            lz4 \
            perl \
            python-is-python3 \
            tar \
            wget \
            curl

          git config --global --add safe.directory "$GITHUB_WORKSPACE/kernel_root"

      # ============================================================
      # 12GB SWAP
      # ============================================================
      - name: Create 12GB Swap
        run: |
          set -e

          echo "=== Disable Existing Swap ==="
          sudo swapoff -a || true

          echo "=== Remove Old Swapfile ==="
          sudo rm -f /swapfile

          echo "=== Create 12GB Swapfile ==="

          sudo fallocate -l 12G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=12288

          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Memory ==="
          free -h

          echo "=== Swap ==="
          swapon --show

      # ============================================================
      # DOWNLOAD AOSP CLANG r450784d
      #
      # Official AOSP Gitiles archive
      #
      # Android T / Android 13 toolchain
      # clang-r450784d
      # ============================================================
      - name: Download AOSP Clang r450784d
        run: |
          set -e

          TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/toolchains"
          CLANG_ROOT="$TOOLCHAIN_ROOT/clang-r450784d"

          ARCHIVE="$TOOLCHAIN_ROOT/clang-r450784d.tar.gz"

          mkdir -p "$TOOLCHAIN_ROOT"

          echo "========================================"
          echo " Downloading AOSP Clang r450784d"
          echo "========================================"

          cd "$TOOLCHAIN_ROOT"

          # Official AOSP Gitiles archive
          wget \
            --continue \
            --show-progress \
            --progress=bar:force \
            -O "$ARCHIVE" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"

          echo ""
          echo "=== Downloaded Archive ==="

          ls -lh "$ARCHIVE"

          echo ""
          echo "=== Archive Type ==="

          file "$ARCHIVE"

          # ========================================================
          # Validate archive
          # ========================================================
          echo ""
          echo "=== Validate Archive ==="

          tar -tzf "$ARCHIVE" >/dev/null

          echo "Archive is valid."

          # ========================================================
          # Extract
          # ========================================================
          echo ""
          echo "=== Extract AOSP Clang ==="

          rm -rf "$CLANG_ROOT"
          mkdir -p "$CLANG_ROOT"

          tar \
            -xzf "$ARCHIVE" \
            -C "$CLANG_ROOT"

          # ========================================================
          # Verify binaries
          # ========================================================
          echo ""
          echo "=== Verify AOSP Clang ==="

          test -x "$CLANG_ROOT/bin/clang"
          test -x "$CLANG_ROOT/bin/ld.lld"

          test -x "$CLANG_ROOT/bin/llvm-ar"
          test -x "$CLANG_ROOT/bin/llvm-nm"
          test -x "$CLANG_ROOT/bin/llvm-objcopy"
          test -x "$CLANG_ROOT/bin/llvm-objdump"
          test -x "$CLANG_ROOT/bin/llvm-readelf"

          echo ""
          echo "=== Clang Path ==="
          realpath "$CLANG_ROOT/bin/clang"

          echo ""
          echo "=== LLD Path ==="
          realpath "$CLANG_ROOT/bin/ld.lld"

          echo ""
          echo "=== Clang Version ==="
          "$CLANG_ROOT/bin/clang" --version

          echo ""
          echo "=== LLD Version ==="
          "$CLANG_ROOT/bin/ld.lld" --version

          # ========================================================
          # Make sure downloaded compiler is NOT system compiler
          # ========================================================
          if [ "$(realpath "$CLANG_ROOT/bin/clang")" = "/usr/bin/clang" ]; then
            echo "ERROR: System clang detected!"
            exit 1
          fi

          if [ "$(realpath "$CLANG_ROOT/bin/ld.lld")" = "/usr/bin/ld.lld" ]; then
            echo "ERROR: System ld.lld detected!"
            exit 1
          fi

          echo ""
          echo "AOSP Clang r450784d downloaded successfully."

      # ============================================================
      # CONFIGURE + BUILD
      # ============================================================
      - name: Configure and Build Kernel
        id: buildKernel
        working-directory: kernel_root
        run: |
          set -e

          # ========================================================
          # BASIC SETTINGS
          # ========================================================
          export ARCH=arm64

          export DEFCONFIG="exlinux_defconfig"
          export DEVICE_ID="A12s"

          export KBUILD_BUILD_USER="exlinux"
          export KBUILD_BUILD_HOST="github"

          export KERNEL_SOURCE="https://github.com/rasolarmand114-tech/exlinux-"

          # ========================================================
          # AOSP CLANG r450784d
          #
          # IMPORTANT:
          # Toolchain is downloaded outside kernel_root
          #
          # $GITHUB_WORKSPACE/
          # ├── kernel_root/
          # └── toolchains/
          #     └── clang-r450784d/
          #         └── bin/
          #             └── clang
          # ========================================================
          export TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/clang-r450784d"
          export LLVM_BIN="$TOOLCHAIN/bin"

          # ========================================================
          # FORCE AOSP TOOLCHAIN FIRST
          # ========================================================
          export PATH="$LLVM_BIN:$PATH"

          # Clear shell command hash
          hash -r

          # ========================================================
          # FORCE ABSOLUTE TOOL PATHS
          # ========================================================
          export CC="$LLVM_BIN/clang"
          export LD="$LLVM_BIN/ld.lld"

          export AR="$LLVM_BIN/llvm-ar"
          export NM="$LLVM_BIN/llvm-nm"

          export OBJCOPY="$LLVM_BIN/llvm-objcopy"
          export OBJDUMP="$LLVM_BIN/llvm-objdump"

          export STRIP="$LLVM_BIN/llvm-strip"
          export READELF="$LLVM_BIN/llvm-readelf"

          # ========================================================
          # LLVM KERNEL BUILD
          # ========================================================
          export LLVM=1
          export LLVM_IAS=1

          # ========================================================
          # TOOLCHAIN VERIFICATION
          # ========================================================
          echo ""
          echo "========================================"
          echo "       AOSP TOOLCHAIN VERIFICATION"
          echo "========================================"

          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "LLVM_BIN=$LLVM_BIN"

          echo ""
          echo "CC=$CC"
          echo "LD=$LD"

          echo ""
          echo "=== PATH ==="
          echo "$PATH"

          echo ""
          echo "=== which clang ==="
          which clang

          echo ""
          echo "=== resolved clang ==="
          realpath "$(which clang)"

          echo ""
          echo "=== exact clang ==="
          realpath "$CC"

          echo ""
          echo "=== clang version ==="
          "$CC" --version

          echo ""
          echo "=== exact ld.lld ==="
          realpath "$LD"

          echo ""
          echo "=== ld.lld version ==="
          "$LD" --version

          # ========================================================
          # HARD CHECKS
          # ========================================================
          test -x "$CC"
          test -x "$LD"

          test -x "$AR"
          test -x "$NM"

          test -x "$OBJCOPY"
          test -x "$OBJDUMP"

          test -x "$STRIP"
          test -x "$READELF"

          # ========================================================
          # NEVER ALLOW SYSTEM CLANG
          # ========================================================
          if [[ "$(realpath "$CC")" == "/usr/bin/clang" ]]; then
            echo ""
            echo "ERROR: /usr/bin/clang detected!"
            echo "AOSP Clang r450784d was NOT selected."
            exit 1
          fi

          if [[ "$(realpath "$LD")" == "/usr/bin/ld.lld" ]]; then
            echo ""
            echo "ERROR: /usr/bin/ld.lld detected!"
            echo "AOSP LLD was NOT selected."
            exit 1
          fi

          echo ""
          echo "AOSP Clang r450784d is active."

          # ========================================================
          # SELINUX
          # ========================================================
          echo ""
          echo "========================================"
          echo "          SELINUX CONFIGURATION"
          echo "========================================"

          if [[ "${{ inputs.SELINUX_PERMISSIVE }}" == "true" ]]; then

            echo "SELinux: Permissive"

            if ! grep -q \
              "^CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" \
              "arch/arm64/configs/$DEFCONFIG"; then

              echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" \
                >> "arch/arm64/configs/$DEFCONFIG"
            fi

            SELINUX_STATE="Permissive"

          else

            echo "SELinux: Enforcing"

            SELINUX_STATE="Enforcing"

          fi

          echo "SELinux state: $SELINUX_STATE"

          # ========================================================
          # DEFCONFIG
          # ========================================================
          echo ""
          echo "========================================"
          echo "             DEFCONFIG"
          echo "========================================"

          make \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            READELF="$READELF" \
            "$DEFCONFIG"

          # ========================================================
          # BUILD KERNEL
          # ========================================================
          echo ""
          echo "========================================"
          echo "           BUILDING KERNEL"
          echo "========================================"

          make \
            -j"$(nproc --all)" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            READELF="$READELF"

          # ========================================================
          # VERIFY BUILD OUTPUT
          # ========================================================
          echo ""
          echo "========================================"
          echo "          VERIFY BUILD OUTPUT"
          echo "========================================"

          test -f arch/arm64/boot/Image

          echo ""
          echo "=== Kernel Image ==="
          ls -lh arch/arm64/boot/Image

          if [ -f arch/arm64/boot/Image.gz ]; then
            echo ""
            echo "=== Kernel Image.gz ==="
            ls -lh arch/arm64/boot/Image.gz
          fi

          # ========================================================
          # SAVE CONFIG
          # ========================================================
          cp .config build_config.txt

          # ========================================================
          # BUILD DETAILS
          # ========================================================
          gitsha1="$(git rev-parse --short HEAD)"
          kernel_version="$(make kernelversion)"

          buildDetails="${kernel_version}-${DEVICE_ID}_${gitsha1}-$(date +'%Y%m%d%H%M%S')"

          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"

          # ========================================================
          # FINAL BUILD REPORT
          # ========================================================
          echo ""
          echo "========================================"
          echo "          BUILD SUCCESSFUL"
          echo "========================================"

          echo "Kernel Version : $kernel_version"
          echo "Device         : $DEVICE_ID"
          echo "Git Commit     : $gitsha1"
          echo "Compiler       : $CC"
          echo "Linker         : $LD"
          echo "Toolchain      : AOSP Clang r450784d"
          echo "SELinux        : $SELINUX_STATE"

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Kernel Images
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          if-no-files-found: error

          path: |
            kernel_root/arch/arm64/boot/Image
            kernel_root/arch/arm64/boot/Image.gz
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
            kernel_root/build_config.txt
