name: Build Kernel LTO

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux-
          path: kernel_root
          ref: ${{ github.event.inputs.BRANCH }}
          fetch-depth: 0

      - name: Prepare dependencies + fetch tags
        working-directory: kernel_root
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc cpio flex bison git python-is-python3 \
            tar perl wget curl lz4 libssl-dev \
            zstd

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Recreate 12GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile

          sudo fallocate -l 12G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=12288

          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      - name: Fetch Proton Clang 11.0.0
        working-directory: kernel_root
        run: |
          mkdir -p toolchains
          cd toolchains

          wget -O proton_clang.tar.zst \
            https://github.com/kdrag0n/proton-clang-build/releases/download/20200117/proton_clang-11.0.0-20200117.tar.zst

          mkdir -p proton-clang

          tar --use-compress-program=unzstd \
            -xf proton_clang.tar.zst \
            -C proton-clang \
            --strip-components=1

          rm -f proton_clang.tar.zst

      - name: Verify Proton Clang
        working-directory: kernel_root
        run: |
          export TOOLCHAIN="$PWD/toolchains/proton-clang"

          export PATH="$TOOLCHAIN/bin:$PATH"

          # Proton Clang bundled binutils libraries
          export LD_LIBRARY_PATH="$TOOLCHAIN/lib:$TOOLCHAIN/lib64:${LD_LIBRARY_PATH:-}"

          echo "========================================"
          echo " Proton Clang Toolchain"
          echo "========================================"

          echo "Toolchain:"
          echo "$TOOLCHAIN"

          echo
          echo "=== clang ==="
          command -v clang
          clang --version

          echo
          echo "=== clang++ ==="
          command -v clang++
          clang++ --version

          echo
          echo "=== llvm-as ==="
          command -v llvm-as
          llvm-as --version

          echo
          echo "=== llvm-ar ==="
          command -v llvm-ar
          llvm-ar --version

          echo
          echo "=== llvm-nm ==="
          command -v llvm-nm
          llvm-nm --version

          echo
          echo "=== llvm-objcopy ==="
          command -v llvm-objcopy
          llvm-objcopy --version

          echo
          echo "=== llvm-objdump ==="
          command -v llvm-objdump
          llvm-objdump --version

          echo
          echo "=== llvm-readelf ==="
          command -v llvm-readelf
          llvm-readelf --version

          echo
          echo "=== llvm-strip ==="
          command -v llvm-strip
          llvm-strip --version

          echo
          echo "=== ld.lld ==="
          command -v ld.lld
          ld.lld --version

          echo
          echo "=== assembler ==="
          command -v as
          as --version || true

          echo
          echo "=== Proton binutils libraries ==="
          find "$TOOLCHAIN" \
            \( -name 'libopcodes*.so*' -o -name 'libbfd*.so*' \) \
            -print

          echo
          echo "=== Dynamic dependencies of as ==="
          ldd "$(command -v as)" || true

          echo
          echo "========================================"
          echo " Proton Clang verification complete"
          echo "========================================"

      - name: Set timezone (Asia/Kolkata)
        run: |
          sudo rm /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

      - name: Build kernel
        id: buildKernel
        working-directory: kernel_root
        run: |
          export TOOLCHAIN="$PWD/toolchains/proton-clang"

          export PATH="$TOOLCHAIN/bin:$PATH"

          # Proton Clang bundled binutils runtime libraries
          export LD_LIBRARY_PATH="$TOOLCHAIN/lib:$TOOLCHAIN/lib64:${LD_LIBRARY_PATH:-}"

          # LLVM / Clang Kbuild configuration
          export LLVM=1
          export LLVM_IAS=1

          # Explicit LLVM tools
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export KBUILD_BUILD_USER="exlinux"
          export KBUILD_BUILD_HOST="github"
          export BUILD_START="$(date)"
          export IS_CI=true

          export DEFCONFIG="exlinux_defconfig"
          export DEVICE_ID="A12s"
          export KERNEL_SOURCE="https://github.com/rasolarmand114-tech/exlinux-"

          if [[ "${{ github.event.inputs.SELINUX_PERMISSIVE }}" == 'true' ]]; then
            echo "Switching SELinux to Permissive mode..."

            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" \
              >> arch/arm64/configs/$DEFCONFIG

            grep "PERMISSIVE" arch/arm64/configs/$DEFCONFIG

            SELINUX_STATE="Permissive"
          else
            SELINUX_STATE="Enforcing"
          fi

          echo "SELinux is set to: $SELINUX_STATE"

          echo "========================================"
          echo " Build configuration"
          echo "========================================"

          echo "Toolchain: $TOOLCHAIN"
          echo "Compiler:"
          clang --version

          echo
          echo "LLVM:"
          llvm-as --version

          echo
          echo "Linker:"
          ld.lld --version

          echo
          echo "Assembler:"
          command -v as
          as --version || true

          echo
          echo "LLVM mode: $LLVM"
          echo "LLVM IAS: $LLVM_IAS"
          echo "Architecture: arm64"
          echo "Defconfig: $DEFCONFIG"
          echo "SELinux: $SELINUX_STATE"

          echo
          echo "========================================"
          echo " Starting kernel build"
          echo "========================================"

          bash ./build_kernel.sh \
            kernel \
            --jobs "$(nproc --all)" \
            "$DEFCONFIG"

          mv .config build_config.txt

          gitsha1="$(git rev-parse --short HEAD)"

          buildDetails="$(make kernelversion)-${DEVICE_ID}_${gitsha1}-$(date '+%Y%m%d%H%M%S')"

          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/arch/arm64/boot/Image
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
