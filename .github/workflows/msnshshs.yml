name: Build Kernel LTO

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: main
        required: true
        type: string
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux-
          path: kernel_root
          ref: ${{ inputs.BRANCH }}
          fetch-depth: 0

      - name: Install Dependencies
        working-directory: kernel_root
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libssl-dev lz4 perl python3 tar wget curl gcc

      - name: Create Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fetch Proton Clang
        working-directory: kernel_root
        run: |
          git clone --depth=1 \
            https://github.com/rasolarmand114-tech/proton-clang.git \
            toolchains/proton-clang

      - name: Build Kernel
        id: buildKernel
        working-directory: kernel_root
        shell: bash
        run: |
          set -e
          
          export TOOLCHAIN="$PWD/toolchains/proton-clang"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export DEFCONFIG=exlinux_defconfig
          export DEVICE_ID=A12s

          export KBUILD_BUILD_USER=exlinux
          export KBUILD_BUILD_HOST=github

          if [[ "${{ inputs.SELINUX_PERMISSIVE }}" == "true" ]]; then
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" \
              >> arch/arm64/configs/$DEFCONFIG
            SELINUX_STATE=Permissive
          else
            SELINUX_STATE=Enforcing
          fi

          echo "========================================"
          echo " Proton Clang"
          echo "========================================"
          clang --version
          echo
          echo "AArch64 binutils:"
          aarch64-linux-gnu-ld --version
          echo
          echo "SELinux: $SELINUX_STATE"

          
          echo "=== Active tools ==="
          which gcc
          which ld
          which clang
          which aarch64-linux-gnu-ld
          echo "=== Versions ==="
          gcc --version
          ld --version
          clang --version
          aarch64-linux-gnu-ld --version

          

          
          
          make -j64 O=aout ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=/usr/bin/gcc  HOSTCXX=/usr/bin/g++   HOSTLD=/usr/bin/ld    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 exlinux_defconfig 

          cp .config build_config.txt

          gitsha1="$(git rev-parse --short HEAD)"
          kernel_version="$(make kernelversion)"
          buildDetails="${kernel_version}-${DEVICE_ID}_${gitsha1}-$(date +'%Y%m%d%H%M%S')"

          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/arch/arm64/boot/Image
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
            kernel_root/build_config.txt
