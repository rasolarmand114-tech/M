name: Build Kernel LTO

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: main
        required: true
        type: string
      SELINUX_PERMISSIVE:
        description: Permissive SELinux
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: rasolarmand114-tech/exlinux-
          path: kernel_root
          ref: ${{ inputs.BRANCH }}
          fetch-depth: 0

      - name: Install Dependencies
        working-directory: kernel_root
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libssl-dev lz4 perl python3 tar wget curl 

      - name: Create Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fetch Proton Clang
        working-directory: kernel_root
        run: |
           
           mkdir -p toolchains/clang
           cd toolchains/clang

           git init
           git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
           git config core.sparseCheckout true

           echo "clang-r450784d" > .git/info/sparse-checkout

           git fetch --depth=1 origin android13-frc-neuralnetworks-release
           git checkout FETCH_HEAD

           cd ../


      - name: Build Kernel
        id: buildKernel
        working-directory: kernel_root
        shell: bash
        run: |
          set -e
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          export ARCH=arm64
          export DEFCONFIG=exlinux_defconfig
          export DEVICE_ID=A12s
          export KBUILD_BUILD_USER=exlinux
          export KBUILD_BUILD_HOST=github
          export BUILD_START=`date`
          export IS_CI=true
          export KERNEL_SOURCE="https://github.com/rasolarmand114-tech/exlinux-"

          if [[ "${{ inputs.SELINUX_PERMISSIVE }}" == "true" ]]; then
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" \
              >> arch/arm64/configs/$DEFCONFIG
            SELINUX_STATE=Permissive
          else
            SELINUX_STATE=Enforcing
           fi
          echo "SELinux: $SELINUX_STATE"
          bash $(pwd)/build_kernel.sh kernel --jobs $(nproc --all) $DEFCONFIG
          
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/arch/arm64/boot/Image
            kernel_root/arch/arm64/boot/dts/exynos/*.dtb
            kernel_root/arch/arm64/boot/dts/samsung/*.dtb
            
