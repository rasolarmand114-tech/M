name: Build Static Bash ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget build-essential \
           gcc-aarch64-linux-gnu musl-tools make

    - name: Download Bash source
      run: |
        wget https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz
        tar xvf bash-5.3.tar.gz

    - name: Configure Bash for ARM64 static build
      run: |
        cd bash-5.3
        export CC=aarch64-linux-gnu-gcc
        ./configure --host=aarch64-linux-gnu \
                    --prefix=/usr \
                    --disable-nls \
                    --disable-readline

    - name: Build Bash
      run: |
        cd bash-5.3
        make

    - name: Upload Bash ELF artifact
      uses: actions/upload-artifact@v4
      with:
        name: bash-arm64
        path: bash-5.3/bash
    - name: Build Bash
      run: |
        cd bash-5.3
        make LDFLAGS="-static"

    - name: Upload Bash ELF artifact
      uses: actions/upload-artifact@v4
      with:
        name: bash-arm64-static
        path: bash-5.3/bash
